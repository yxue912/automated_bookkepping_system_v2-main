name: Windows release smoke test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        required: true
        default: v8.2

permissions:
  contents: read

jobs:
  launch:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download release assets
        shell: pwsh
        run: |
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          Invoke-WebRequest "$base/WaterRefilling.App.exe" -OutFile "$env:GITHUB_WORKSPACE/WaterRefilling.App.exe"
          Invoke-WebRequest "$base/AquaARC-win-x64.zip" -OutFile "$env:GITHUB_WORKSPACE/AquaARC-win-x64.zip"
          Expand-Archive "$env:GITHUB_WORKSPACE/AquaARC-win-x64.zip" -DestinationPath "$env:GITHUB_WORKSPACE/package"

      - name: Launch both Windows downloads
        shell: pwsh
        run: |
          function Assert-AppStarts([string]$path) {
            $app = Start-Process -FilePath $path -WorkingDirectory (Split-Path $path) -PassThru
            try {
              Start-Sleep -Seconds 20
              $app.Refresh()
              if ($app.HasExited) {
                throw "$path exited during startup with code $($app.ExitCode)"
              }
              Write-Host "$path remained running after startup"
            }
            finally {
              if (-not $app.HasExited) {
                Stop-Process -Id $app.Id -Force
              }
            }
          }

          Assert-AppStarts "$env:GITHUB_WORKSPACE/WaterRefilling.App.exe"
          Assert-AppStarts "$env:GITHUB_WORKSPACE/package/WaterRefilling.App.exe"
